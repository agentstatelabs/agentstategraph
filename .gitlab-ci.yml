stages:
  - check
  - test

default:
  image: rust:1-bookworm
  cache:
    key:
      files:
        - Cargo.lock
    paths:
      - .cargo/
      - target/
  before_script:
    - export CARGO_HOME="$CI_PROJECT_DIR/.cargo"
    - apt-get update -qq && apt-get install -y -qq protobuf-compiler cmake clang libclang-dev pkg-config python3 python3-dev
    # Override the Mac-only PYO3_PYTHON pinned in .cargo/config.toml
    - export PYO3_PYTHON="$(command -v python3)"
    - rustc --version && cargo --version && python3 --version

fmt:
  stage: check
  script:
    - rustup component add rustfmt
    - cargo fmt --all -- --check
  allow_failure: true

clippy:
  stage: check
  script:
    - rustup component add clippy
    - cargo clippy --workspace --all-targets -- -D warnings
  allow_failure: true

build:
  stage: check
  script:
    - cargo build --workspace --locked

test:
  stage: test
  script:
    - cargo test --workspace --locked
