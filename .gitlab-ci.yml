# Only run pipelines that matter, and never the same SHA twice:
#  * merge requests get a detached pipeline so feature branches are validated
#    (fmt/clippy/build/test) BEFORE they merge — the team workflow lands all
#    feature work via MR;
#  * a plain push of an internal working branch (claude/*, worktree-agent-*, …)
#    with no open MR gets no pipeline — the MR pipeline covers it;
#  * a `release: vX` commit on main is validated by its tag pipeline (pushed
#    right after — same SHA, plus the publish stage), so its branch pipeline is
#    skipped to avoid a duplicate full compile.
# A new pipeline on an already-released tag is safe: every publish job skips
# what is already published (RELEASE.md, "Re-running a tag pipeline").
workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_TITLE =~ /^release: v/'
      when: never
    # Detached pipeline for merge requests (feature-branch validation).
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG
    # Don't also run a branch pipeline when that branch has an open MR — the
    # merge_request_event pipeline above already covers the same commits.
    - if: '$CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - when: never

stages:
  - check
  - test
  - publish
  - package
  - release

default:
  image: rust:1.96-bookworm
  cache:
    # Per-job cache lineage (prefix) so concurrent check/test jobs don't clobber
    # a single shared key on push — each keeps its own warm target/ + sccache
    # across runs, keyed by the resolved dependency set (Cargo.lock).
    key:
      files:
        - Cargo.lock
      prefix: "$CI_JOB_NAME"
    paths:
      - .cargo/
      - target/
      - .sccache/
  before_script:
    - export CARGO_HOME="$CI_PROJECT_DIR/.cargo"
    - apt-get update -qq && apt-get install -y -qq protobuf-compiler cmake clang libclang-dev pkg-config python3 python3-dev
    # Override the Mac-only PYO3_PYTHON pinned in .cargo/config.toml
    - export PYO3_PYTHON="$(command -v python3)"
    # sccache: cache compiled crates across pipeline runs to speed rebuilds
    - export CARGO_INCREMENTAL=0 RUSTC_WRAPPER=sccache SCCACHE_DIR="$CI_PROJECT_DIR/.sccache"
    - command -v sccache >/dev/null || (curl -sSfL https://github.com/mozilla/sccache/releases/download/v0.8.2/sccache-v0.8.2-x86_64-unknown-linux-musl.tar.gz | tar -xz -C /tmp && install /tmp/sccache-v0.8.2-x86_64-unknown-linux-musl/sccache /usr/local/bin/)
    - rustc --version && cargo --version && python3 --version && sccache --version

fmt:
  stage: check
  cache: {}   # rustfmt only — no compilation, so skip the cache restore/upload
  script:
    - rustup component add rustfmt
    - cargo fmt --all -- --check

binding-contract:
  stage: check
  image: python:3.13-slim
  before_script: []
  cache: {}
  script:
    - python3 scripts/check-binding-capabilities.py

release-script-contract:
  stage: check
  image: alpine:latest
  before_script: []
  cache: {}
  script:
    - apk add --no-cache bash jq >/dev/null
    - bash scripts/test-github-actions-ci.sh

clippy:
  stage: check
  script:
    - rustup component add clippy
    - cargo clippy --workspace --all-targets -- -D clippy::correctness

build:
  stage: check
  script:
    - cargo build --workspace --locked

test:
  stage: test
  # Postgres for the backend conformance suites (DESIGN.md Plan D t-001).
  # Without TEST_DATABASE_URL their Postgres legs skip. The alias resolves on
  # both the docker and kubernetes executors.
  services:
    - name: postgres:16
      alias: postgres
  variables:
    POSTGRES_USER: asg
    POSTGRES_PASSWORD: asg
    POSTGRES_DB: asg_test
    TEST_DATABASE_URL: postgres://asg:asg@postgres:5432/asg_test
    # Fail rather than skip if the database is ever missing.
    ASG_REQUIRE_POSTGRES: "1"
  script:
    # The ASD proxy is behind the off-by-default `providers` feature.
    - cargo test --locked -p agentstategraph-mcp --features providers --test asd_proxy
    - cargo test --workspace --locked --exclude agentstategraph-python
    # Postgres TLS is opt-in (postgres-tls); compile and unit-test it too.
    - cargo test --locked -p agentstategraph-storage --features postgres-tls,memory --lib

# version-guard: on a release tag, prove every version the publish stage will
# stamp agrees with the tag BEFORE anything publishes. This is the backstop for
# the drift that produced a 0.9.8 wheel from a 0.9.11 tag: if the workspace
# version or the TS package.json disagree with $CI_COMMIT_TAG, fail here in the
# check stage. scripts/release.sh keeps all of these in sync; this enforces it.
version-guard:
  stage: check
  image: alpine:latest
  before_script: []   # alpine has no apt-get; skip the debian/rust default setup
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - |
      TAG="${CI_COMMIT_TAG#v}"
      WS=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
      PJ=$(sed -n 's/.*"version": "\(.*\)".*/\1/p' bindings/typescript/package.json | head -1)
      echo "tag=$TAG  workspace=$WS  ts-package.json=$PJ"
      fail=0
      [ "$WS" = "$TAG" ] || { echo "ERROR: [workspace.package].version ($WS) != tag ($TAG)"; fail=1; }
      [ "$PJ" = "$TAG" ] || { echo "ERROR: bindings/typescript/package.json ($PJ) != tag ($TAG)"; fail=1; }
      # Swift binding metadata (Package.swift / release.json) is intentionally
      # NOT checked here: the swift xcframework release is a separate, opt-in
      # ASG step (prepare-swift-release, manual) and must never gate a Rust/TS
      # release or its GitHub mirror. See create-release-tag.
      if [ "$fail" != 0 ]; then
        echo "Release metadata is inconsistent; do not publish or retag manually."; exit 1
      fi
      echo "version-guard OK: workspace + ts at $TAG"

# On a release tag, build the Python wheel (pyo3/maturin) and publish it so
# downstream Python projects can `pip install agentstategraph`.
#
# Re-running the tag pipeline is safe: a wheel the registry already has is
# skipped. GitLab answers a repeat upload with 400 "File name has already been
# taken", which twine 6.2 and later no longer treat as --skip-existing, so each
# wheel is first looked up in the project's simple index. --skip-existing still
# covers a registry that answers 409 or "already exists".
publish-wheel:
  stage: publish
  allow_failure: true   # internal GitLab-PyPI wheel; never block the release/mirror
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - apt-get install -y -qq python3-pip
    - pip3 install --break-system-packages --quiet maturin twine
    - cd bindings/python
    - maturin build --release -i python3 --out dist
    - |
      upload=()
      for whl in dist/*.whl; do
        file="${whl##*/}"
        listing=$(curl -fs -u "gitlab-ci-token:${CI_JOB_TOKEN}" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/pypi/simple/${file%%-*}" || true)
        case "$listing" in
          *">${file}</a>"*) echo "skip ${file} (already in the GitLab PyPI registry)" ;;
          *) upload+=("$whl") ;;
        esac
      done
      if [ "${#upload[@]}" -gt 0 ]; then
        TWINE_USERNAME=gitlab-ci-token TWINE_PASSWORD="${CI_JOB_TOKEN}" \
          twine upload --non-interactive --skip-existing \
          --repository-url "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/pypi" \
          "${upload[@]}"
      fi

# On a release tag, build the napi-rs native addon and publish the Node package
# to the GitLab npm registry. Scoped to Linux x64 only — the same single-platform
# scope as publish-wheel (manylinux). A full cross-platform matrix (macOS/Windows/
# arm64 via optionalDependencies) is a napi build-matrix follow-up. allow_failure
# so an internal-registry hiccup never blocks the release/mirror.
#
# Re-running the tag pipeline is safe: the job skips the publish when `npm view`
# already resolves this name@version. It reads the same .npmrc as `npm publish`,
# so it asks the registry the job publishes to. Without the skip, GitLab accepts
# a repeat publish and the job passes, but a background step then rejects the
# duplicate and leaves an errored 0.0.0-<uuid> package in the registry.
publish-npm:
  stage: publish
  allow_failure: true
  rules:
    - if: $CI_COMMIT_TAG
  variables:
    NODE_VERSION: "20.18.1"   # @napi-rs/cli@3 needs Node >= 20; bookworm apt ships 18
  script:
    # Install Node from the official tarball (same idiom as the sccache install
    # in default.before_script) — apt's nodejs is 18 and lacks node:util styleText.
    - curl -fsSL "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-linux-x64.tar.gz" | tar -xz -C /opt
    - export PATH="/opt/node-v${NODE_VERSION}-linux-x64/bin:$PATH"
    - node --version && npm --version
    - cd bindings/typescript
    - npm install --no-audit --no-fund
    - npm run build   # napi build --release --platform -> agentstategraph.linux-x64-gnu.node
    - |
      cat > .npmrc <<EOF
      registry=${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/npm/
      //${CI_SERVER_HOST}/api/v4/projects/${CI_PROJECT_ID}/packages/npm/:_authToken=${CI_JOB_TOKEN}
      EOF
    - |
      name=$(node -p 'require("./package.json").name')
      version=$(node -p 'require("./package.json").version')
      if [ "$(npm view "${name}@${version}" version 2>/dev/null)" = "$version" ]; then
        echo "skip ${name} ${version} (already in the GitLab npm registry)"
      else
        npm publish
      fi

# publish-github: mirror main + release tags to the PUBLIC GitHub repo, but only
# after scripts/leak-scan.sh passes (fail closed). This replaces GitLab push
# mirroring, which the ci-guard below was already written to expect — push
# mirroring would also expose internal branches (claude/*, worktree-agent-*),
# whereas scripts/publish-to-github.sh pushes ONLY main and matching release
# tags. Set CI variables GITHUB_REPO (org/name) and GITHUB_TOKEN (repo scope,
# masked + protected). Gated on GITHUB_REPO so it no-ops until configured.
#
# Re-running a tag pipeline is safe: the tag is already on GitHub, so its push
# is a no-op and GitHub's release workflow does not fire again, and main moves
# only when it fast-forwards. Once main has moved past the tag, GitHub's main is
# no longer the tag's ancestor, so the leak scan covers the tag's whole history
# and takes a few minutes.
publish-github:
  stage: publish
  image: debian:bookworm-slim
  variables:
    # Full clone: leak-scan --range HEAD scans all history, and the
    # fast-forward-only push must see GitHub's tip as an ancestor.
    GIT_DEPTH: 0
  cache: {}
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends git ca-certificates
    - printf '%s' "${LEAKSCAN_LOCAL:-}" > .leakscan.local
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $GITHUB_REPO'
    - if: '$CI_COMMIT_TAG && $GITHUB_REPO'
  script:
    - bash scripts/publish-to-github.sh

# publish-crates: publish the workspace crates to crates.io from a release tag
# (scripts/publish-crates.sh). It needs publish-github, so only a tag that
# passed the checks, the tests and the mirror's fail-closed leak scan gets
# here, and it runs the leak scan again on the tree it packages. Re-running it
# is safe: crates already at this version are skipped. resource_group keeps two
# tag pipelines from publishing at once.
#
# Set CARGO_REGISTRY_TOKEN (masked + protected; v* tags are protected): a
# crates.io token scoped to publish-update and agentstategraph*. Gated on it so
# the job no-ops until configured. publish-update cannot create a crate, so a
# crate new to the workspace is published once by hand (RELEASE.md). Rules are
# evaluated when a pipeline is created, so a tag pipeline created before the
# token existed has no publish-crates job: run a new pipeline for the tag.
publish-crates:
  stage: publish
  needs:
    - job: publish-github
      artifacts: false
  resource_group: crates-io
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/ && $CARGO_REGISTRY_TOKEN'
  script:
    - |
      if [ -z "${LEAKSCAN_LOCAL:-}" ]; then
        echo "ERROR: LEAKSCAN_LOCAL unset; not publishing without the org leak-scan patterns"; exit 1
      fi
      printf '%s' "$LEAKSCAN_LOCAL" > .leakscan.local
    - bash scripts/leak-scan.sh --tree
    - bash scripts/publish-crates.sh --publish

# create-release-tag: THE tag authority, and the FINAL act of a release. It runs
# in the last stage, so everything before it in the release-prep pipeline — the
# GitHub mirror and the (non-blocking) swift xcframework prep — has already run.
# It tags the CURRENT main HEAD: when prepare-swift-release succeeds it has
# pushed a `release: vX` manifest commit (checksum-pinned Package.swift) on top
# of the prep commit, so the tag captures it; when swift fails (allow_failure)
# main is unchanged and the tag lands on the prep commit — the release still
# ships. Rust, TS/npm, Python/wheel, and the GitHub mirror all key off this tag.
create-release-tag:
  stage: release
  image: alpine:latest
  before_script: []
  cache: {}
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_COMMIT_TITLE =~ /^release-prep: v/'
  script:
    - apk add --no-cache git >/dev/null
    - git config user.email "ci@agentstategraph" && git config user.name "GitLab CI"
    - |
      VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
      TAG="v${VERSION}"
      if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
        echo "tag ${TAG} already exists on origin; nothing to do"; exit 0
      fi
      case "$CI_SERVER_URL" in
        https://*) push_url="https://oauth2:${GITLAB_RELEASE_TOKEN}@${CI_SERVER_URL#https://}/${CI_PROJECT_PATH}.git" ;;
        http://*)  push_url="http://oauth2:${GITLAB_RELEASE_TOKEN}@${CI_SERVER_URL#http://}/${CI_PROJECT_PATH}.git" ;;
        *) echo "ERROR: unexpected CI_SERVER_URL '$CI_SERVER_URL'"; exit 1 ;;
      esac
      # Tag the latest main: prepare-swift-release may have pushed the
      # checksum-pinned Package.swift manifest commit on top of the prep commit.
      git fetch -q origin main
      TARGET=$(git rev-parse FETCH_HEAD)
      git tag -a "$TAG" -m "$TAG" "$TARGET"
      git push "$push_url" "refs/tags/${TAG}"
      echo "pushed ${TAG} at ${TARGET}"

# Swift xcframework release prep — runs on EVERY `release-prep: vX` pipeline, in
# the stage BEFORE create-release-tag. It dispatches the macOS builder on
# GitHub, stages the exact output in GitLab's Generic Package Registry, renders
# the checksum-pinned root Package.swift, and pushes a `release: vX` manifest
# commit to main (NO tag — create-release-tag owns the tag, in the next stage).
# allow_failure so a swift-only problem never blocks the release: if it fails,
# main is unchanged and create-release-tag simply tags the prep commit.
prepare-swift-release:
  stage: package
  image: debian:bookworm-slim
  allow_failure: true
  variables:
    GIT_DEPTH: 0
  cache: {}
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends ca-certificates curl gh git jq unzip
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_COMMIT_TITLE =~ /^release-prep: v/'
  script:
    - bash scripts/prepare-swift-release-ci.sh

# The tag pipeline publishes the byte-identical artifact staged above. GitHub
# remains the public download surface, but never rebuilds the checksum-pinned
# Swift asset after the tag has been created. Re-running a tag pipeline is safe:
# assets already on the GitHub release with the staged bytes are skipped, not
# deleted and re-uploaded, and the SwiftPM verification runs again.
publish-swift-release:
  stage: release
  image: debian:bookworm-slim
  allow_failure: true   # swift is opt-in; a tag cut without a staged xcframework must not fail
  variables:
    GIT_DEPTH: 0
  cache: {}
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends ca-certificates curl gh git jq
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - bash scripts/publish-swift-release-ci.sh

# ci-guard: guarantees a NON-EMPTY pipeline and fails loudly if the publish
# prerequisites are missing. Without this, a mis-scoped publish job produces
# no pipeline at all — silent, and easy to miss for days.
ci-guard:
  stage: check
  image: alpine:latest
  before_script: []   # alpine has no apt-get; skip the debian/rust default setup
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - echo "pipeline ran for $CI_COMMIT_SHORT_SHA on $CI_COMMIT_BRANCH"
    - |
      if [ -z "$GITHUB_REPO" ]; then
        echo "ERROR: GITHUB_REPO unset -> publish-github will NOT run"; exit 1
      fi
      echo "publish-github target: $GITHUB_REPO"
      if echo "$CI_COMMIT_TITLE" | grep -q "^release-prep: v"; then
        for name in GITLAB_RELEASE_TOKEN; do
          eval "value=\${$name:-}"
          if [ -z "$value" ]; then
            echo "ERROR: $name unset -> Swift release preparation cannot run"; exit 1
          fi
        done
      fi

# site-version: move agentstategraph in agentstatelabs.com/releases.json to this
# tag, which is what agentstategraph.dev and agentstatelabs.com show as the
# current version. Delayed like the downstream installers so the site does not
# advertise a release before GitHub has built it. Gated on SITE_RELEASES_TOKEN
# so it no-ops until that is configured. Re-running a tag pipeline is safe: the
# script only moves the version forward, and pushes nothing when releases.json
# already shows this tag or a newer one.
site-version:
  stage: .post
  image: debian:bookworm-slim
  before_script: []
  cache: {}
  needs:
    - job: publish-github
      artifacts: false
  rules:
    - if: '$CI_COMMIT_TAG && $SITE_RELEASES_TOKEN'
      when: delayed
      start_in: 10 minutes
  variables:
    SITE_PROJECT: site/agentstatelabs-site
    SITE_PRODUCT: agentstategraph
  script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends git ca-certificates python3
    - ./scripts/publish-site-version.sh
