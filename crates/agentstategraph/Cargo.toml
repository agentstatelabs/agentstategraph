[package]
name = "agentstategraph"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
documentation = "https://docs.rs/agentstategraph"
keywords.workspace = true
categories.workspace = true
homepage.workspace = true
repository.workspace = true
description = "AI-native versioned state store for intent-based systems"

[features]
default = ["sqlite"]
sqlite = ["agentstategraph-storage/sqlite"]

[dependencies]
agentstategraph-core = { workspace = true }
agentstategraph-storage = { workspace = true, default-features = false }
agentstategraph-taint = { workspace = true }
agentstategraph-reminders = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
# Spans, events and metrics through the facades only; the binary that embeds
# the library decides where they go (docs/OBSERVABILITY.md).
tracing = "0.1"
metrics = "0.24"

[dev-dependencies]
# tests/backend_conformance.rs runs every built-in backend, Postgres included
# when TEST_DATABASE_URL is set.
agentstategraph-storage = { workspace = true, features = ["sqlite", "memory", "postgres"] }
# tests/telemetry.rs records the repository's spans and metrics in memory.
oxtel-sdk = "0.3"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }
