[package]
name = "agentstategraph"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
documentation.workspace = true
homepage.workspace = true
repository.workspace = true
description = "AI-native versioned state store for intent-based systems"

[features]
default = ["sqlite"]
sqlite = ["agentstategraph-storage/sqlite"]

[dependencies]
agentstategraph-core = { path = "../agentstategraph-core", version = "0.9.6" }
agentstategraph-storage = { path = "../agentstategraph-storage", default-features = false, version = "0.9.6" }
agentstategraph-taint = { path = "../agentstategraph-taint", version = "0.9.6" }
agentstategraph-reminders = { path = "../agentstategraph-reminders", version = "0.9.6" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
