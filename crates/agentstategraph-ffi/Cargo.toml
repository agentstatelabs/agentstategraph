[package]
name = "agentstategraph-ffi"
version.workspace = true
# napi-rs proc-macros are not compatible with edition 2024; keep at 2021.
edition = "2021"
authors.workspace = true
license.workspace = true
documentation.workspace = true
homepage.workspace = true
repository.workspace = true
description = "C ABI for AgentStateGraph — enables Go, Ruby, Java, C# bindings"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
default = []
# Enables Postgres-backed storage in the FFI — for any
# Postgres-first consumer that links through the C ABI.
# Adds the `agentstategraph_new_postgres` extern.
postgres = ["agentstategraph-storage/postgres", "dep:tokio"]

[dependencies]
agentstategraph = { workspace = true, features = ["sqlite"] }
agentstategraph-core = { workspace = true }
agentstategraph-storage = { workspace = true, features = ["sqlite"] }
agentstategraph-tasks = { workspace = true }
agentstategraph-policy = { workspace = true }
agentstategraph-taint = { workspace = true }
agentstategraph-migrate = { workspace = true }
chrono = { workspace = true }
tokio = { version = "1", features = ["rt", "rt-multi-thread"], optional = true }
semver = "1"
serde = { workspace = true }
serde_json = { workspace = true }
