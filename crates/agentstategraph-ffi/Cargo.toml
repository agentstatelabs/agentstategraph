[package]
name = "agentstategraph-ffi"
version.workspace = true
# napi-rs proc-macros are not compatible with edition 2024; keep at 2021.
edition = "2021"
authors.workspace = true
license.workspace = true
description = "C ABI for AgentStateGraph — enables Go, Ruby, Java, C# bindings"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
default = []
# Enables Postgres-backed storage in the FFI — required for
# CTXone Pro and any other Postgres-first consumer that links
# through the C ABI. Adds the `agentstategraph_new_postgres`
# extern.
postgres = ["agentstategraph-storage/postgres", "dep:tokio"]

[dependencies]
agentstategraph = { path = "../agentstategraph" }
agentstategraph-core = { path = "../agentstategraph-core" }
agentstategraph-storage = { path = "../agentstategraph-storage" }
agentstategraph-tasks = { path = "../agentstategraph-tasks" }
agentstategraph-policy = { path = "../agentstategraph-policy" }
agentstategraph-taint = { path = "../agentstategraph-taint" }
agentstategraph-migrate = { path = "../agentstategraph-migrate" }
chrono = { workspace = true }
tokio = { version = "1", features = ["rt", "rt-multi-thread"], optional = true }
semver = "1"
serde = { workspace = true }
serde_json = { workspace = true }
