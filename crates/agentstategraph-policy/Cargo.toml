[package]
name = "agentstategraph-policy"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
documentation = "https://docs.rs/agentstategraph-policy"
keywords.workspace = true
categories.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Policy primitive (authorization + change-cost gating + fallback) for AgentStateGraph"

[dependencies]
agentstategraph = { workspace = true, default-features = false }
agentstategraph-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
regex = "1"
once_cell = "1"
# Spans, events and metrics through the facades only (docs/OBSERVABILITY.md).
tracing = "0.1"
metrics = "0.24"

[dev-dependencies]
agentstategraph-storage = { workspace = true, default-features = false }
# tests/telemetry.rs records evaluations' spans and metrics in memory.
oxtel-sdk = "0.3"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }
