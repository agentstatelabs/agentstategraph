[package]
name = "agentstategraph-storage"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
documentation.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Pluggable storage backends for AgentStateGraph"

[features]
default = ["sqlite"]
memory = []
sqlite = ["dep:rusqlite"]
postgres = ["dep:tokio-postgres", "dep:deadpool-postgres", "dep:tokio"]
indexeddb = ["memory"]

[dependencies]
agentstategraph-core = { path = "../agentstategraph-core", version = "0.9.6" }
agentstategraph-taint = { path = "../agentstategraph-taint", version = "0.9.6" }
agentstategraph-reminders = { path = "../agentstategraph-reminders", version = "0.9.6" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
rusqlite = { workspace = true, optional = true }
tokio-postgres = { version = "0.7", features = ["with-serde_json-1", "with-chrono-0_4"], optional = true }
deadpool-postgres = { version = "0.14", optional = true }
tokio = { version = "1", features = ["rt", "rt-multi-thread"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
rusqlite = { workspace = true }
agentstategraph-taint = { path = "../agentstategraph-taint", version = "0.9.6" }
uuid = { workspace = true }
