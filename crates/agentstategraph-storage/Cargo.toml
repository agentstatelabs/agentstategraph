[package]
name = "agentstategraph-storage"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
documentation = "https://docs.rs/agentstategraph-storage"
keywords.workspace = true
categories.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Pluggable storage backends for AgentStateGraph"

[features]
default = ["sqlite"]
memory = []
# Each backend records its queries as database spans and metrics through
# oxtel-sql, which uses the `tracing` and `metrics` facades only.
sqlite = ["dep:rusqlite", "dep:metrics", "dep:oxtel-sql", "oxtel-sql/rusqlite"]
postgres = [
    "dep:tokio-postgres",
    "dep:deadpool-postgres",
    "dep:tokio",
    "dep:oxtel-sql",
    "oxtel-sql/postgres",
    "oxtel-sql/deadpool-postgres",
]
# TLS for Postgres connections: rustls, verified against Mozilla's roots plus
# any `sslrootcert`. Opt-in so the default build stays free of rustls.
postgres-tls = ["postgres", "dep:rustls", "dep:tokio-rustls", "dep:webpki-roots"]
indexeddb = ["memory"]

[dependencies]
agentstategraph-core = { workspace = true }
agentstategraph-taint = { workspace = true }
agentstategraph-reminders = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
rusqlite = { workspace = true, optional = true }
tokio-postgres = { version = "0.7", features = ["with-serde_json-1", "with-chrono-0_4"], optional = true }
deadpool-postgres = { version = "0.14", optional = true }
oxtel-sql = { version = "0.3", optional = true }
# SQLite's single connection, recorded as a pool of one.
metrics = { version = "0.24", optional = true }
tokio = { version = "1", features = ["rt", "rt-multi-thread"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"], optional = true }
webpki-roots = { version = "1", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
# tests/telemetry.rs records the backends' spans and metrics in memory.
oxtel-sdk = "0.3"
metrics = "0.24"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }
rusqlite = { workspace = true }
agentstategraph-taint = { workspace = true }
uuid = { workspace = true }

[package.metadata.docs.rs]
# Document the optional backends and evaluators too.
all-features = true
