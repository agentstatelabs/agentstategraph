[package]
name = "agentstategraph-mcp"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "MCP server for AgentStateGraph — AI-native versioned state store"

[lib]
name = "agentstategraph_mcp"
path = "src/lib.rs"

[[bin]]
name = "agentstategraph-mcp"
path = "src/main.rs"

[dependencies]
agentstategraph = { path = "../agentstategraph" }
agentstategraph-core = { path = "../agentstategraph-core" }
agentstategraph-migrate = { path = "../agentstategraph-migrate" }
agentstategraph-tasks = { path = "../agentstategraph-tasks" }
agentstategraph-policy = { path = "../agentstategraph-policy" }
agentstategraph-policy-sign = { path = "../agentstategraph-policy-sign" }
ed25519-dalek = "2"
hex = "0.4"
semver = "1"
agentstategraph-storage = { path = "../agentstategraph-storage", features = ["postgres"] }
rmcp = { version = "1", features = ["server", "transport-io", "macros"] }
schemars = "1"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["full"] }
chrono = { workspace = true }
uuid = { workspace = true }
rand = "0.9"
axum = "0.8"
tower-http = { version = "0.6", features = ["cors"] }
tower_governor = { version = "0.8", features = ["axum"] }
governor = "0.10"
tracing = "0.1"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
