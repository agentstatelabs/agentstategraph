[package]
name = "agentstategraph-mcp"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "MCP server for AgentStateGraph — AI-native versioned state store"

[lib]
name = "agentstategraph_mcp"
path = "src/lib.rs"

[[bin]]
name = "agentstategraph-mcp"
path = "src/main.rs"

[dependencies]
agentstategraph = { path = "../agentstategraph" }
agentstategraph-core = { path = "../agentstategraph-core" }
agentstategraph-migrate = { path = "../agentstategraph-migrate" }
agentstategraph-tasks = { path = "../agentstategraph-tasks" }
agentstategraph-policy = { path = "../agentstategraph-policy" }
agentstategraph-policy-sign = { path = "../agentstategraph-policy-sign" }
agentstategraph-taint = { path = "../agentstategraph-taint" }
agentstategraph-reminders = { path = "../agentstategraph-reminders" }
agentstategraph-policy-wasm = { path = "../agentstategraph-policy-wasm", optional = true }
agentstategraph-policy-rego = { path = "../agentstategraph-policy-rego", optional = true }
agentstategraph-policy-cedar = { path = "../agentstategraph-policy-cedar", optional = true }
ed25519-dalek = "2"
hex = "0.4"
semver = "1"
agentstategraph-storage = { path = "../agentstategraph-storage", features = ["postgres"] }
rmcp = { version = "1", features = ["server", "transport-io", "macros"] }
schemars = "1"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["full"] }
chrono = { workspace = true }
uuid = { workspace = true }
rand = "0.9"
axum = "0.8"
tower-http = { version = "0.6", features = ["cors"] }
tower_governor = { version = "0.8", features = ["axum"] }
governor = "0.10"
tracing = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }

[features]
default = []
policy-wasm = ["dep:agentstategraph-policy-wasm"]
policy-rego = ["dep:agentstategraph-policy-rego"]
policy-cedar = ["dep:agentstategraph-policy-cedar"]
all-external-evaluators = ["policy-wasm", "policy-rego", "policy-cedar"]
# Guard rail: any future external-network provider crate (reqwest, rustls, AI
# clients) MUST be gated behind this feature so `cargo build` stays lean.
# Pattern: providers = ["dep:my-providers-crate"]
# Validate with: cargo build --no-default-features && cargo tree --no-default-features | grep reqwest
providers = ["dep:reqwest"]

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
agentstategraph-ffi = { path = "../agentstategraph-ffi" }
