[package]
name = "agentstategraph-wasm"
version.workspace = true
# wasm-bindgen proc-macros are not compatible with edition 2024; keep at 2021.
edition = "2021"
authors.workspace = true
license.workspace = true
description = "WASM bindings for AgentStateGraph — browser, Deno, Node"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
agentstategraph = { path = "../agentstategraph", default-features = false }
agentstategraph-core = { path = "../agentstategraph-core" }
agentstategraph-storage = { path = "../agentstategraph-storage", default-features = false, features = ["indexeddb"] }
agentstategraph-tasks = { path = "../agentstategraph-tasks" }
agentstategraph-taint = { path = "../agentstategraph-taint" }
agentstategraph-policy = { path = "../agentstategraph-policy" }
agentstategraph-policy-sign = { path = "../agentstategraph-policy-sign" }
agentstategraph-migrate = { path = "../agentstategraph-migrate" }
hex = "0.4"
ed25519-dalek = "2"
semver = "1"
wasm-bindgen = { version = "0.2", features = ["serde-serialize"] }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
js-sys = "0.3"

[dev-dependencies]
wasm-bindgen-test = "0.3"
agentstategraph-storage = { path = "../agentstategraph-storage", default-features = false }
hex = "0.4"
ed25519-dalek = "2"
