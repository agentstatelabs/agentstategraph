[package]
name = "agentstategraph-wasm"
version.workspace = true
# wasm-bindgen proc-macros are not compatible with edition 2024; keep at 2021.
edition = "2021"
authors.workspace = true
license.workspace = true
documentation.workspace = true
homepage.workspace = true
repository.workspace = true
description = "WASM bindings for AgentStateGraph — browser, Deno, Node"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
agentstategraph = { workspace = true, default-features = false }
agentstategraph-core = { workspace = true }
agentstategraph-storage = { workspace = true, default-features = false, features = ["indexeddb"] }
agentstategraph-tasks = { workspace = true }
agentstategraph-taint = { workspace = true }
agentstategraph-policy = { workspace = true }
agentstategraph-policy-sign = { workspace = true }
agentstategraph-migrate = { workspace = true }
hex = "0.4"
ed25519-dalek = "2"
semver = "1"
wasm-bindgen = { version = "0.2", features = ["serde-serialize"] }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
js-sys = "0.3"

[dev-dependencies]
wasm-bindgen-test = "0.3"
agentstategraph-storage = { workspace = true, default-features = false }
hex = "0.4"
ed25519-dalek = "2"
