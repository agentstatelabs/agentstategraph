[package]
name = "agentstategraph-tasks"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
documentation = "https://docs.rs/agentstategraph-tasks"
keywords.workspace = true
categories.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Shared task-store primitives built on AgentStateGraph"

[dependencies]
agentstategraph = { workspace = true, default-features = false }
agentstategraph-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
regex = "1"
once_cell = "1"

[dev-dependencies]
# tests/task_notes.rs runs on every built-in backend, Postgres included when
# TEST_DATABASE_URL is set.
agentstategraph-storage = { workspace = true, default-features = false, features = ["sqlite", "memory", "postgres"] }
uuid = { workspace = true }
# Sync for the renumbering tests (DESIGN.md Plan G t-010), which the library
# itself doesn't need, and SQLite, which every test opens, so the tests build
# on their own as well as with the workspace.
agentstategraph = { workspace = true, features = ["sync", "sqlite"] }
