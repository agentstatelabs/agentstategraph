# Prometheus for AgentStateGraph's observability profile: scrapes the
# collector, which carries the server's metrics, and loads the alert rules.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
