[package]
name = "agentstategraph-napi"
version.workspace = true
edition = "2024"
description = "TypeScript/Node.js bindings for AgentStateGraph via napi-rs"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
agentstategraph = { workspace = true, features = ["sqlite"] }
agentstategraph-core = { workspace = true }
agentstategraph-migrate = { workspace = true }
agentstategraph-storage = { workspace = true, features = ["sqlite"] }
agentstategraph-tasks = { workspace = true }
agentstategraph-policy = { workspace = true }
agentstategraph-policy-sign = { workspace = true }
agentstategraph-taint = { workspace = true }
ed25519-dalek = "2"
hex = "0.4"
semver = "1"
napi = { version = "2", features = ["napi9", "serde-json"] }
napi-derive = "2"
serde = { workspace = true }
serde_json = "1"

[build-dependencies]
napi-build = "2"
