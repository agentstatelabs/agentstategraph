[package]
name = "agentstategraph-napi"
version.workspace = true
edition = "2024"
description = "TypeScript/Node.js bindings for AgentStateGraph via napi-rs"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
agentstategraph = { path = "../../crates/agentstategraph", version = "0.9.6" }
agentstategraph-core = { path = "../../crates/agentstategraph-core", version = "0.9.6" }
agentstategraph-migrate = { path = "../../crates/agentstategraph-migrate", version = "0.9.6" }
agentstategraph-storage = { path = "../../crates/agentstategraph-storage", version = "0.9.6" }
agentstategraph-tasks = { path = "../../crates/agentstategraph-tasks", version = "0.9.6" }
agentstategraph-policy = { path = "../../crates/agentstategraph-policy", version = "0.9.6" }
agentstategraph-policy-sign = { path = "../../crates/agentstategraph-policy-sign", version = "0.9.6" }
agentstategraph-taint = { path = "../../crates/agentstategraph-taint", version = "0.9.6" }
ed25519-dalek = "2"
hex = "0.4"
semver = "1"
napi = { version = "2", features = ["napi9", "serde-json"] }
napi-derive = "2"
serde = { workspace = true }
serde_json = "1"

[build-dependencies]
napi-build = "2"
