[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "agentstategraph"
version = "0.4.0b3"
description = "AI-native versioned state store for intent-based systems"
readme = "../../README.md"
license = {text = "BSL-1.1"}
requires-python = ">=3.8"

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "agentstategraph_py"
