[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "agentstategraph"
dynamic = ["version"]
description = "AI-native versioned state store for intent-based systems"
readme = "../../README.md"
license = {text = "MIT OR Apache-2.0"}
requires-python = ">=3.8"

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "agentstategraph_py"
