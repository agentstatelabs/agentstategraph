[package]
name = "agentstategraph-python"
version.workspace = true
edition = "2024"
description = "Python bindings for AgentStateGraph — AI-native versioned state store"
license = "MIT OR Apache-2.0"

[lib]
name = "agentstategraph_py"
crate-type = ["cdylib"]

[dependencies]
agentstategraph = { workspace = true, features = ["sqlite"] }
agentstategraph-core = { workspace = true }
agentstategraph-migrate = { workspace = true }
agentstategraph-policy = { workspace = true }
agentstategraph-storage = { workspace = true, features = ["sqlite"] }
agentstategraph-tasks = { workspace = true }
agentstategraph-taint = { workspace = true }
chrono = { version = "0.4", features = ["serde"] }
semver = "1"
pyo3 = { version = "0.24", features = ["extension-module", "multiple-pymethods"] }
serde_json = "1"
