[package]
name = "agentstategraph-python"
version = "0.8.5"
edition = "2024"
description = "Python bindings for AgentStateGraph — AI-native versioned state store"
license = "BSL-1.1"

[lib]
name = "agentstategraph_py"
crate-type = ["cdylib"]

[dependencies]
agentstategraph = { path = "../../crates/agentstategraph" }
agentstategraph-core = { path = "../../crates/agentstategraph-core" }
agentstategraph-migrate = { path = "../../crates/agentstategraph-migrate" }
agentstategraph-policy = { path = "../../crates/agentstategraph-policy" }
agentstategraph-storage = { path = "../../crates/agentstategraph-storage" }
agentstategraph-tasks = { path = "../../crates/agentstategraph-tasks" }
agentstategraph-taint = { path = "../../crates/agentstategraph-taint" }
chrono = { version = "0.4", features = ["serde"] }
semver = "1"
pyo3 = { version = "0.24", features = ["extension-module", "multiple-pymethods"] }
serde_json = "1"
