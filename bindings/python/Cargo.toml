[package]
name = "agentstategraph-python"
version.workspace = true
edition = "2024"
description = "Python bindings for AgentStateGraph — AI-native versioned state store"
license = "MIT OR Apache-2.0"

[lib]
name = "agentstategraph_py"
crate-type = ["cdylib"]
# No Rust test harness for this crate.
#
# `pyo3/extension-module` deliberately does not link libpython — the symbols
# come from the host interpreter when the module is imported. A `cargo test`
# harness has no interpreter, so it aborts at load with
# "symbol not found in flat namespace '_PyBaseObject_Type'".
#
# There is nothing to lose: this crate has no #[test] at all. The bindings are
# tested from Python, in bindings/python/tests/*.py.
#
# Without this, `cargo test --workspace` fails for everyone, which is why CI
# carries an --exclude for this crate.
test = false
doctest = false

[dependencies]
agentstategraph = { workspace = true, features = ["sqlite"] }
agentstategraph-core = { workspace = true }
agentstategraph-migrate = { workspace = true }
agentstategraph-policy = { workspace = true }
agentstategraph-storage = { workspace = true, features = ["sqlite"] }
agentstategraph-tasks = { workspace = true }
agentstategraph-taint = { workspace = true }
chrono = { version = "0.4", features = ["serde"] }
semver = "1"
pyo3 = { version = "0.24", features = ["extension-module", "multiple-pymethods"] }
serde_json = "1"
