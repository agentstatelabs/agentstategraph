[workspace]
resolver = "2"
members = [
    "crates/agentstategraph-core",
    "crates/agentstategraph-storage",
    "crates/agentstategraph",
    "crates/agentstategraph-tasks",
    "crates/agentstategraph-policy",
    "crates/agentstategraph-policy-sign",
    "crates/agentstategraph-policy-wasm",
    "crates/agentstategraph-policy-rego",
    "crates/agentstategraph-policy-cedar",
    "crates/agentstategraph-taint",
    "crates/agentstategraph-reminders",
    "crates/agentstategraph-migrate",
    "crates/agentstategraph-mcp",
    "crates/agentstategraph-ffi",
    "crates/agentstategraph-wasm",
    "bindings/python",
    "bindings/typescript",
]

[workspace.package]
version = "1.2.0"
edition = "2024"
authors = ["AgentStateLabs, LLC"]
license = "MIT OR Apache-2.0"
description = "AI-native versioned state store for intent-based systems"
repository = "https://github.com/agentstatelabs/agentstategraph"
homepage = "https://github.com/agentstatelabs/agentstategraph"
documentation = "https://docs.rs/agentstategraph"

[workspace.dependencies]
# Internal crates — version tracks [workspace.package].version so it never drifts.
# default-features off here so members can opt in/out; feature-relying members name features explicitly.
agentstategraph = { path = "crates/agentstategraph", version = "1.2.0", default-features = false }
agentstategraph-core = { path = "crates/agentstategraph-core", version = "1.2.0" }
agentstategraph-storage = { path = "crates/agentstategraph-storage", version = "1.2.0", default-features = false }
agentstategraph-tasks = { path = "crates/agentstategraph-tasks", version = "1.2.0" }
agentstategraph-policy = { path = "crates/agentstategraph-policy", version = "1.2.0" }
agentstategraph-policy-sign = { path = "crates/agentstategraph-policy-sign", version = "1.2.0" }
agentstategraph-policy-wasm = { path = "crates/agentstategraph-policy-wasm", version = "1.2.0" }
agentstategraph-policy-rego = { path = "crates/agentstategraph-policy-rego", version = "1.2.0" }
agentstategraph-policy-cedar = { path = "crates/agentstategraph-policy-cedar", version = "1.2.0" }
agentstategraph-taint = { path = "crates/agentstategraph-taint", version = "1.2.0" }
agentstategraph-reminders = { path = "crates/agentstategraph-reminders", version = "1.2.0" }
agentstategraph-migrate = { path = "crates/agentstategraph-migrate", version = "1.2.0" }
agentstategraph-ffi = { path = "crates/agentstategraph-ffi", version = "1.2.0" }

blake3 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde", "js"] }
rusqlite = { version = "0.33", features = ["bundled"] }
