name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v0.3.5-beta.2)'
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: agentstategraph-mcp

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # Cross-compilation for aarch64 Linux (Jetson/ARM)
      - name: Install cross-compilation tools
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "[target.aarch64-unknown-linux-gnu]" >> ~/.cargo/config.toml
          echo 'linker = "aarch64-linux-gnu-gcc"' >> ~/.cargo/config.toml

      - name: Build release binary
        run: cargo build --release -p agentstategraph-mcp --target ${{ matrix.target }}

      - name: Package binary
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          ARCHIVE_NAME="${BINARY_NAME}-${TAG}-${{ matrix.target }}"
          mkdir -p "${ARCHIVE_NAME}"
          cp "target/${{ matrix.target }}/release/${BINARY_NAME}" "${ARCHIVE_NAME}/"
          cp LICENSE LICENSING.md README.md "${ARCHIVE_NAME}/"
          tar czf "${ARCHIVE_NAME}.tar.gz" "${ARCHIVE_NAME}"
          echo "ARCHIVE=${ARCHIVE_NAME}.tar.gz" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ env.ARCHIVE }}

  # Build WASM bundle
  wasm:
    name: Build WASM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Build WASM
        run: wasm-pack build crates/agentstategraph-wasm --target web --release
      - name: Package WASM
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          ARCHIVE_NAME="agentstategraph-wasm-${TAG}"
          mkdir -p "${ARCHIVE_NAME}"
          cp -r crates/agentstategraph-wasm/pkg/* "${ARCHIVE_NAME}/"
          tar czf "${ARCHIVE_NAME}.tar.gz" "${ARCHIVE_NAME}"
          echo "ARCHIVE=${ARCHIVE_NAME}.tar.gz" >> $GITHUB_ENV
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wasm
          path: ${{ env.ARCHIVE }}

  # Build FFI shared library for Go/C bindings
  ffi:
    name: Build FFI ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            lib: libagentstategraph_ffi.so
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            lib: libagentstategraph_ffi.so
            cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
            lib: libagentstategraph_ffi.dylib
          - target: aarch64-apple-darwin
            os: macos-latest
            lib: libagentstategraph_ffi.dylib

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ffi-${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "[target.aarch64-unknown-linux-gnu]" >> ~/.cargo/config.toml
          echo 'linker = "aarch64-linux-gnu-gcc"' >> ~/.cargo/config.toml

      - name: Build FFI
        run: cargo build --release -p agentstategraph-ffi --target ${{ matrix.target }}

      - name: Package FFI
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          ARCHIVE_NAME="agentstategraph-ffi-${TAG}-${{ matrix.target }}"
          mkdir -p "${ARCHIVE_NAME}"
          cp "target/${{ matrix.target }}/release/${{ matrix.lib }}" "${ARCHIVE_NAME}/" 2>/dev/null || true
          cp "target/${{ matrix.target }}/release/libagentstategraph_ffi.a" "${ARCHIVE_NAME}/" 2>/dev/null || true
          tar czf "${ARCHIVE_NAME}.tar.gz" "${ARCHIVE_NAME}"
          echo "ARCHIVE=${ARCHIVE_NAME}.tar.gz" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffi-${{ matrix.target }}
          path: ${{ env.ARCHIVE }}

  # Create GitHub Release with all artifacts
  release:
    name: Create Release
    needs: [build, wasm, ffi]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f -name '*.tar.gz'

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: AgentStateGraph ${{ github.event.inputs.tag || github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.event.inputs.tag || github.ref_name, 'beta') || contains(github.event.inputs.tag || github.ref_name, 'alpha') }}
          generate_release_notes: true
          files: artifacts/**/*.tar.gz
          body: |
            ## Installation

            Download the binary for your platform and run it:

            ```bash
            # Mac (Apple Silicon)
            tar xzf agentstategraph-mcp-*-aarch64-apple-darwin.tar.gz
            ./agentstategraph-mcp-*/agentstategraph-mcp --http --port 3001

            # Mac (Intel)
            tar xzf agentstategraph-mcp-*-x86_64-apple-darwin.tar.gz
            ./agentstategraph-mcp-*/agentstategraph-mcp --http --port 3001

            # Linux (x86_64)
            tar xzf agentstategraph-mcp-*-x86_64-unknown-linux-gnu.tar.gz
            ./agentstategraph-mcp-*/agentstategraph-mcp --http --port 3001

            # Linux (ARM64 / Jetson / Raspberry Pi)
            tar xzf agentstategraph-mcp-*-aarch64-unknown-linux-gnu.tar.gz
            ./agentstategraph-mcp-*/agentstategraph-mcp --http --port 3001
            ```

            Or use as an MCP server (stdio mode — the default):
            ```bash
            ./agentstategraph-mcp
            ```

            ## Links

            - [Documentation](https://agentstategraph.dev)
            - [Explorer](https://agentstategraph.dev/explorer/)
            - [ThreadWeaver](https://threadweaver.org) — reference chat app
