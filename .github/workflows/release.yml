name: Release

# Cut a release by pushing a tag, e.g.:
#   git tag v0.9.2 && git push origin v0.9.2
#
# Produces, for each supported platform, the exact archive name that
# install.sh downloads:  agentstategraph-mcp-<tag>-<target>.tar.gz
# and pushes the container image to ghcr.io/agentstatelabs/agentstategraph.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub Release + upload assets
  packages: write # push to GHCR

env:
  CARGO_TERM_COLOR: always

jobs:
  binaries:
    name: binary (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            cross_linker: gcc-aarch64-linux-gnu
          # Cross-compile x86_64-apple-darwin on Apple-silicon. macos-13 (Intel)
          # is GitHub's most-contended runner class — jobs queue for hours/never
          # start. dtolnay/rust-toolchain installs the target; Apple's toolchain
          # cross-compiles between mac arches natively.
          - os: macos-14
            target: x86_64-apple-darwin
          - os: macos-14 # Apple-silicon runner
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
          targets: ${{ matrix.target }}

      - name: Cross toolchain (aarch64 linux)
        if: matrix.cross_linker != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.cross_linker }}
          # Linker for the Rust target, and C compiler for the `cc` crate
          # (bundled SQLite is compiled from C for the cross target).
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --release --locked -p agentstategraph-mcp --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          version="${GITHUB_REF_NAME}"
          dist="agentstategraph-mcp-${version}-${{ matrix.target }}"
          mkdir "$dist"
          cp "target/${{ matrix.target }}/release/agentstategraph-mcp" "$dist/"
          tar czf "${dist}.tar.gz" "$dist"
          shasum -a 256 "${dist}.tar.gz" > "${dist}.tar.gz.sha256"

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            agentstategraph-mcp-*.tar.gz
            agentstategraph-mcp-*.tar.gz.sha256

  # The checksum-pinned Swift XCFramework is prepared before this tag exists.
  # GitLab dispatches prepare-swift.yml, stages the exact bytes, generates the
  # root Package.swift, and uploads those bytes to this release from the tag
  # pipeline. Rebuilding here would risk publishing a ZIP whose checksum no
  # longer matches the tagged manifest.

  docker:
    name: container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/agentstatelabs/agentstategraph
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      # linux/amd64 only for now — the Dockerfile compiles from source, and a
      # QEMU-emulated arm64 Rust build is prohibitively slow. To add arm64,
      # feed the prebuilt binaries from the `binaries` job into a runtime-only
      # Dockerfile and set platforms: linux/amd64,linux/arm64.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
