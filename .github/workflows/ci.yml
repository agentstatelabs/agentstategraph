name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: asg_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Run tests (with Postgres)
        env:
          TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/asg_test
        run: cargo test --workspace --exclude agentstategraph-wasm --exclude agentstategraph-python --exclude agentstategraph-napi --features agentstategraph-storage/postgres

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Clippy
        # -D warnings is mandatory as of 0.6.75-beta.1 — see ROADMAP.md
        # Working agreements. Only agentstategraph-python is excluded
        # (environmental _PyBaseObject_Type link issue on some runners).
        run: cargo clippy --workspace --exclude agentstategraph-python --all-targets -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  wasm:
    name: WASM Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Build WASM
        run: cargo build -p agentstategraph-wasm --target wasm32-unknown-unknown --release

  go:
    name: Go Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Build FFI
        run: cargo build --release -p agentstategraph-ffi
      - name: Run Go tests
        working-directory: bindings/go
        run: CGO_LDFLAGS="-L../../target/release" LD_LIBRARY_PATH="../../target/release" go test -v

  dotnet:
    # Experimental — community-maintained. Known test failures (System.Text.Json
    # polymorphism collision on Decision.Kind; see bindings/dotnet/README.md
    # "Known issues"). continue-on-error so the rest of the workspace is
    # not blocked on .NET fixes. Flip back to required once the suite goes
    # green on all three OSes — likely via a community PR.
    name: .NET (experimental)
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Build FFI (release)
        run: cargo build --release -p agentstategraph-ffi
      - name: dotnet restore
        working-directory: bindings/dotnet
        run: dotnet restore
      - name: dotnet build
        working-directory: bindings/dotnet
        run: dotnet build -c Release --no-restore
      - name: dotnet test
        working-directory: bindings/dotnet
        env:
          AGENTSTATEGRAPH_FFI_PATH: ${{ github.workspace }}/target/release
        run: dotnet test -c Release --no-build --verbosity normal
