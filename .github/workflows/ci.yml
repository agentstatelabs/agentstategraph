name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # .cargo/config.toml is gitignored (it pins a machine-local PYO3_PYTHON on
  # dev machines); on CI there is none, so point pyo3 at the runner's python.
  PYO3_PYTHON: python3

jobs:
  test:
    name: check + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (pinned via rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            protobuf-compiler cmake clang libclang-dev pkg-config \
            python3 python3-dev

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy (correctness gate)
        run: cargo clippy --workspace --all-targets -- -D clippy::correctness

      - name: Build
        run: cargo build --workspace --locked

      - name: Test
        run: cargo test --workspace --locked --exclude agentstategraph-python

  swift:
    name: swift binding (macOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (pinned via rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"

      - uses: Swatinem/rust-cache@v2

      # Local-dylib mode: link the host build directly and run XCTest.
      # The device-capable XCFramework is exercised by the release workflow.
      - name: Build FFI (release)
        run: cargo build --release --locked -p agentstategraph-ffi

      - name: Swift test (local-dylib mode)
        working-directory: bindings/swift
        env:
          AGENTSTATEGRAPH_SWIFT_LOCAL: "1"
        run: swift test

      - name: Validate Swift distribution manifest
        run: |
          version="$(python3 -c 'import json; print(json.load(open("bindings/swift/release.json"))["version"])')"
          checksum="$(python3 -c 'import json; print(json.load(open("bindings/swift/release.json"))["checksum"])')"
          temporary_manifest="$(mktemp)"
          scripts/render-swift-package.sh "$version" "$checksum" "$temporary_manifest"
          diff -u Package.swift "$temporary_manifest"
          swift package dump-package > /dev/null
